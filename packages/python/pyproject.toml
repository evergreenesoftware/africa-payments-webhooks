[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "africa-payments-webhooks"
version = "0.1.0"
description = "Verify and normalise payment webhooks from African providers (Paystack, Flutterwave, Monnify, Squad, Korapay, Fincra, Interswitch, Nomba). Zero dependencies; Django, Flask and FastAPI helpers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Popoola Sinaayo (Evergreene Software LTD)" }]
keywords = ["webhook", "paystack", "flutterwave", "monnify", "squad", "korapay", "fincra", "interswitch", "nomba", "nigeria", "africa", "payments", "hmac"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Framework :: Django",
  "Framework :: Flask",
  "Framework :: FastAPI",
  "Topic :: Office/Business :: Financial",
  "Topic :: Security :: Cryptography",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "mypy>=1.10", "ruff>=0.6", "django>=4.2", "flask>=3", "fastapi>=0.110", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/EVERGREENE_ORG/africa-payments-webhooks"
Issues = "https://github.com/EVERGREENE_ORG/africa-payments-webhooks/issues"
Changelog = "https://github.com/EVERGREENE_ORG/africa-payments-webhooks/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/africa_payments_webhooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "E501"]  # line length is handled by `ruff format`

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # test secrets are not real secrets

[tool.mypy]
strict = true
packages = ["africa_payments_webhooks"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["django.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["africa_payments_webhooks.adapters.django"]
disallow_untyped_decorators = false
warn_return_any = false
