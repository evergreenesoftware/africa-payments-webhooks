name: Add a provider
description: Request support for another African payment provider.
labels: [new-provider]
body:
  - type: input
    id: name
    attributes: { label: Provider name }
    validations: { required: true }
  - type: input
    id: docs
    attributes: { label: Link to official webhook/signature docs }
    validations: { required: true }
  - type: textarea
    id: notes
    attributes: { label: Anything else (test vectors, sandbox access) }
